<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minigame Văn hóa VN trong kỷ nguyên số</title>
    <style>
        /* Tùy chỉnh chủ đề Tết */
        body {
            background-color: #a71d2a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #f1c40f;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-size: 2.5rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            justify-content: center;
            align-items: stretch; /* Đổi thành stretch để cột ảnh cao bằng cột chữ */
            max-width: 1100px;
            width: 100%;
        }

        /* Bảng ô chữ */
        .board {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(10, 45px);
            gap: 6px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .row:hover {
            transform: scale(1.02);
        }

        .cell {
            width: 45px;
            height: 45px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid #f1c40f;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: transparent;
            text-transform: uppercase;
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .cell.highlight {
            background-color: rgba(241, 196, 15, 0.3);
            border-color: #ff9f43;
        }

        .cell.correct {
            background-color: #2ecc71 !important;
            border-color: #27ae60 !important;
            color: #fff !important;
        }

        .cell.wrong {
            background-color: #e74c3c !important;
            border-color: #c0392b !important;
            color: #fff !important;
        }

        /* Cột chứa ảnh */
        .image-container {
            display: flex;
            flex: 1; /* Cho phép cột ảnh chiếm hết không gian chiều ngang còn lại */
            min-width: 300px; /* Đảm bảo trên điện thoại ảnh không bị bóp nhỏ quá */
        }

        /* Ảnh bên cạnh */
        .image-container img {
            width: 100%;
            height: 100%; /* Ép ảnh cao bằng 100% cột chứa nó */
            object-fit: cover; /* Đảm bảo ảnh không bị méo tỉ lệ khi phóng to */
            border: none; /* ĐÃ BỎ VIỀN */
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        /* Modal hiển thị câu hỏi */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 5px solid #a71d2a;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal h2 {
            margin-top: 0;
            color: #a71d2a;
            font-size: 1.4rem;
            line-height: 1.5;
        }

        .modal input {
            width: 80%;
            padding: 12px;
            font-size: 1.2rem;
            margin: 20px 0;
            border: 2px solid #ccc;
            border-radius: 8px;
            text-align: center;
            text-transform: uppercase;
        }

        .modal input:focus {
            border-color: #a71d2a;
            outline: none;
        }

        .modal button {
            background: #f1c40f;
            color: #a71d2a;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal button:hover {
            background: #e1b70d;
        }

        .close-btn {
            background: #ccc !important;
            color: #333 !important;
            margin-left: 10px;
        }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #e74c3c;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none;
            z-index: 1001;
        }

    </style>
</head>
<body>

    <h1>Minigame Mon Van Hoa</h1>

    <div class="game-container">
        <!-- Khu vực bảng chữ -->
        <div class="board" id="board"></div>

        <!-- Khu vực ảnh minh họa -->
        <div class="image-container">
            <img src="mamnguqua.jpg" alt="Mâm Ngũ Quả" onerror="this.src='https://via.placeholder.com/400x500.png?text=Loi+anh+mamnguqua.jpg'">
        </div>
    </div>

    <!-- Cửa sổ nổi hiển thị câu hỏi -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="questionText">Câu hỏi sẽ hiện ở đây</h2>
            <input type="text" id="answerInput" placeholder="Nhập câu trả lời..." autocomplete="off">
            <br>
            <button onclick="checkAnswer()">TRẢ LỜI</button>
            <button class="close-btn" onclick="closeModal()">ĐÓNG</button>
        </div>
    </div>

    <!-- Thông báo sai -->
    <div id="toast">CÂU TRẢ LỜI SAI!</div>

    <!-- Âm thanh -->
    <audio id="audioDung" src="dung.mp3"></audio>
    <audio id="audioSai" src="sai.mp3"></audio>

    <script>
        const gameData = [
            { q: "1. A large green/yellow citrus fruit placed on the tray for good luck.", a: "pomelo", offset: 3 },
            { q: "2. A tropical fruit, its name sounds like 'enough' in the Southern dialect.", a: "papaya", offset: 4 },
            { q: "3. A sweet yellow fruit, its name sounds like 'to spend' in the Southern dialect.", a: "mango", offset: 5 },
            { q: "4. A curved fruit that often forms the base of the tray in Northern Vietnam.", a: "banana", offset: 3 },
            { q: "5. A small fruit symbolizing fullness and satisfaction (sung túc).", a: "fig", offset: 3 },
            { q: "6. A hard-shelled fruit with water inside, sounding like 'just enough'.", a: "coconut", offset: 0 },
            { q: "7. A tiny citrus fruit tree popular during Tet, symbolizing wealth.", a: "kumquat", offset: 2 },
            { q: "8. The tray consists of five different types of ____.", a: "fruit", offset: 3 },
            { q: "9. The place in the house where the tray is displayed to honor ancestors.", a: "altar", offset: 5 },
        ];

        let currentRow = -1;
        const TARGET_COL = 5;

        function initBoard() {
            const board = document.getElementById("board");
            
            gameData.forEach((item, rowIndex) => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "row";
                rowDiv.dataset.row = rowIndex;
                rowDiv.onclick = () => openModal(rowIndex);

                for (let col = 0; col < 10; col++) {
                    const cell = document.createElement("div");
                    
                    if (col >= item.offset && col < item.offset + item.a.length) {
                        cell.className = "cell";
                        if (col === TARGET_COL) {
                            cell.classList.add("highlight");
                            cell.dataset.highlight = "true";
                        }
                        cell.dataset.charIndex = col - item.offset; 
                    } else {
                        cell.style.visibility = "hidden";
                    }
                    rowDiv.appendChild(cell);
                }
                board.appendChild(rowDiv);
            });
        }

        function openModal(rowIndex) {
            currentRow = rowIndex;
            document.getElementById("questionText").innerText = gameData[rowIndex].q;
            const input = document.getElementById("answerInput");
            input.value = "";
            document.getElementById("modalOverlay").style.display = "flex";
            input.focus();
        }

        function closeModal() {
            document.getElementById("modalOverlay").style.display = "none";
        }

        document.getElementById("answerInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkAnswer();
        });

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 2500);
        }

        function checkAnswer() {
            const userInput = document.getElementById("answerInput").value.trim().toLowerCase();
            const correctAnswer = gameData[currentRow].a.toLowerCase();
            const cells = document.querySelectorAll(`.row[data-row="${currentRow}"] .cell`);
            
            closeModal();

            if (userInput === correctAnswer) {
                document.getElementById("audioDung").play();
                
                cells.forEach((cell, index) => {
                    setTimeout(() => {
                        cell.innerText = correctAnswer[index];
                        cell.classList.remove("wrong");
                        cell.classList.add("correct");
                    }, index * 200);
                });
            } else {
                document.getElementById("audioSai").play();
                showToast("CÂU TRẢ LỜI SAI!");
                
                const paddedInput = userInput.padEnd(correctAnswer.length, ' ').substring(0, correctAnswer.length);

                cells.forEach((cell, index) => {
                    setTimeout(() => {
                        cell.innerText = paddedInput[index] !== ' ' ? paddedInput[index] : '?';
                        cell.classList.remove("correct");
                        cell.classList.add("wrong");
                    }, index * 200);
                });

                const fadeDelay = correctAnswer.length * 200 + 1000;
                
                setTimeout(() => {
                    cells.forEach((cell, index) => {
                        setTimeout(() => {
                            cell.classList.remove("wrong");
                            cell.innerText = "";
                        }, index * 150);
                    });
                }, fadeDelay);
            }
        }

        window.onload = initBoard;
    </script>
</body>
</html>
