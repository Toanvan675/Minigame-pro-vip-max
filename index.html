<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minigame</title>
    <!-- Thư viện tạo hiệu ứng Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Import font chữ viết tay Dancing Script từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        /* Nền Gấm đỏ đậm phong cách hoàng gia */
        body {
            background-color: #a71d2a;
            /* Họa tiết gấm chìm truyền thống */
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2.5H0V11h20V8.5H0V6h20V3.5H0V1h20V0h2v1h20v2.5H22V6h20v2.5H22V11h20v2.5H22V16h20v2H22v2.5h20V23h-20v2.5h20V28h-20v2.5h20V33h-20v2.5h20V38h-20v2H20v-2H0v-2.5h20V33H0v-2.5h20V28H0v-2.5h20V23H0v-2.5h20z' fill='%23901622' fill-opacity='0.5' fill-rule='evenodd'/%3E%3C/svg%3E");
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;     
            min-height: 100vh;
            overflow: hidden;        
        }

        /* KHUNG VIỀN VÀNG RỒNG PHƯỢNG (ROYAL FRAME) */
        .royal-frame {
            position: fixed;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 3px solid #f1c40f;
            outline: 2px solid #f1c40f;
            outline-offset: -8px;
            pointer-events: none; /* Rất quan trọng: Không chặn click chuột vào game */
            z-index: 998;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.4), 0 0 20px rgba(0,0,0,0.5);
        }

        /* 4 Góc trang trí (Chỗ hiển thị rongphuong.png) */
        .corner {
            position: absolute;
            width: 150px;
            height: 150px;
            background-image: url('rongphuong.png'); /* Sẵn sàng nhận file rongphuong.png của bạn */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: top left;
            z-index: 999;
        }

        /* Định vị & Lật đối xứng 4 góc */
        .corner.tl { top: -5px; left: -5px; }
        .corner.tr { top: -5px; right: -5px; transform: scaleX(-1); }
        .corner.bl { bottom: -5px; left: -5px; transform: scaleY(-1); }
        .corner.br { bottom: -5px; right: -5px; transform: scale(-1, -1); }

        /* Họa tiết góc mạ vàng bằng CSS (Hiển thị mượt mà kể cả khi chưa có ảnh rồng) */
        .corner::before, .corner::after {
            content: '';
            position: absolute;
            border-top: 5px solid #f1c40f;
            border-left: 5px solid #f1c40f;
            box-shadow: -2px -2px 6px rgba(0,0,0,0.4);
        }
        .corner::before {
            top: 0; left: 0;
            width: 80px; height: 80px;
        }
        .corner::after {
            top: 15px; left: 15px;
            width: 40px; height: 40px;
        }

        /* Màn hình khởi động để yêu cầu Fullscreen */
        #startScreen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #a71d2a;
            z-index: 10000; /* Che toàn bộ viền */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #startScreen h1 {
            font-family: 'Dancing Script', cursive; /* Đổi sang font viết tay */
            font-size: clamp(4rem, 10vw, 8rem); /* Font to linh hoạt không tràn viền */
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.5);
        }

        #startBtn {
            padding: 20px 50px;
            font-size: 1.8rem;
            background: #f1c40f;
            color: #a71d2a;
            border: 4px solid #fff;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: transform 0.2s, background 0.2s;
            text-transform: uppercase;
        }

        #startBtn:hover {
            transform: scale(1.05);
            background: #e1b70d;
        }

        h1.game-title {
            font-family: 'Dancing Script', cursive; /* Đổi sang font viết tay */
            color: #f1c40f;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.6);
            /* Tăng kích thước lên ~300% (từ 2.4rem lên max 7.5rem) bằng clamp để không rớt khỏi border */
            font-size: clamp(4rem, 8vw, 7.5rem); 
            margin-top: 10px;
            margin-bottom: 25px;
            letter-spacing: 2px;
            text-align: center;
            z-index: 10;
            line-height: 1;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px; 
            justify-content: center;
            align-items: stretch;
            max-width: 1200px; 
            width: 100%;
            margin: 0 auto;
            z-index: 10;
        }

        /* Bảng ô chữ */
        .board {
            display: flex;
            flex-direction: column;
            gap: 6px; 
        }

        .row {
            display: grid;
            grid-template-columns: repeat(10, 52px); 
            gap: 6px; 
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .row:hover {
            transform: scale(1.03); 
        }

        .row.solved {
            cursor: default;
            pointer-events: none;
        }

        .cell {
            width: 52px; 
            height: 52px; 
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid #f1c40f;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px; 
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Giữ nguyên font ô đáp án */
            color: transparent;
            text-transform: uppercase;
            transition: background-color 0.3s, border-color 0.3s, color 0.3s, box-shadow 0.3s;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .cell.highlight {
            background-color: rgba(241, 196, 15, 0.4);
            border-color: #ff9f43;
        }

        .cell.correct {
            background-color: #2ecc71 !important;
            border-color: #27ae60 !important;
            color: #fff !important;
        }

        .cell.wrong {
            background-color: #e74c3c !important;
            border-color: #c0392b !important;
            color: #fff !important;
        }

        .cell.win-glow {
            background-color: #f1c40f !important;
            color: #a71d2a !important;
            border-color: #fff !important;
            box-shadow: 0 0 20px 8px rgba(241, 196, 15, 0.9) !important;
            z-index: 10;
            position: relative;
            animation: winPulse 1s infinite alternate;
        }

        @keyframes winPulse {
            from { box-shadow: 0 0 15px 5px rgba(241, 196, 15, 0.8) !important; }
            to { box-shadow: 0 0 30px 10px rgba(241, 196, 15, 1) !important; }
        }

        /* Cột chứa ảnh */
        .image-container {
            display: flex;
            flex: 1;
            min-width: 320px; 
            max-width: 450px; 
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        /* Modal hiển thị câu hỏi - Đã được làm to và rõ hơn */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: #fff;
            color: #333;
            padding: 40px 30px; /* Tăng padding */
            border-radius: 15px;
            width: 95%;
            max-width: 700px; /* Bảng rộng hơn */
            text-align: center;
            border: 6px solid #a71d2a;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2.5H0V11h20V8.5H0V6h20V3.5H0V1h20V0h2v1h20v2.5H22V6h20v2.5H22V11h20v2.5H22V16h20v2H22v2.5h20V23h-20v2.5h20V28h-20v2.5h20V33h-20v2.5h20V38h-20v2H20v-2H0v-2.5h20V33H0v-2.5h20V28H0v-2.5h20V23H0v-2.5h20z' fill='%23a71d2a' fill-opacity='0.05' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .modal h2 {
            margin-top: 0;
            color: #a71d2a;
            font-size: 2.2rem; /* Chữ câu hỏi to rõ hơn */
            line-height: 1.5;
            font-weight: 700;
        }

        .modal input {
            width: 90%;
            padding: 18px; /* Tăng padding để thanh nhập to hơn */
            font-size: 1.8rem; /* Chữ nhập vào to hơn */
            margin: 25px 0;
            border: 3px solid #ccc;
            border-radius: 8px;
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
        }

        .modal input:focus {
            border-color: #a71d2a;
            outline: none;
            box-shadow: 0 0 10px rgba(167, 29, 42, 0.3);
        }

        .modal button {
            background: #f1c40f;
            color: #a71d2a;
            border: none;
            padding: 15px 40px; /* Nút bấm to hơn */
            font-size: 1.5rem; /* Chữ nút bấm to hơn */
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .modal button:hover {
            background: #e1b70d;
            transform: scale(1.05);
        }

        .close-btn {
            background: #ccc !important;
            color: #333 !important;
            margin-left: 20px;
        }
        
        .close-btn:hover {
            background: #bbb !important;
        }

        #toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #e74c3c;
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.3rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            display: none;
            z-index: 1001;
        }

        footer {
            margin-top: 35px;
            text-align: center;
            z-index: 10;
        }

        .developer-link {
            font-family: 'Dancing Script', cursive; /* Đồng bộ font viết tay */
            color: #f1c40f;
            font-size: 2.5rem; /* Tăng size để match với title to */
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 2px;
            display: inline-block;
            transition: transform 0.2s;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .developer-link:hover {
            transform: scale(1.1);
            animation: flashGreen 0.5s infinite alternate;
        }

        @keyframes flashGreen {
            0% { color: #2ecc71; text-shadow: 0 0 10px #2ecc71, 0 0 20px #2ecc71; }
            100% { color: #a8ffb2; text-shadow: 0 0 25px #2ecc71, 0 0 40px #2ecc71; }
        }

    </style>
</head>
<body>

    <!-- Màn hình chờ bắt buộc để kích hoạt Fullscreen -->
    <div id="startScreen">
        <h1>Minigame</h1>
        <button id="startBtn">Bắt Đầu Chơi</button>
    </div>

    <!-- Lớp viền mạ vàng & 4 góc Rồng Phượng -->
    <div class="royal-frame">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
    </div>

    <h1 class="game-title">Minigame</h1>

    <div class="game-container">
        <!-- Khu vực bảng chữ -->
        <div class="board" id="board"></div>

        <!-- Khu vực ảnh minh họa -->
        <div class="image-container">
            <img src="mamnguqua.jpg" alt="Mâm Ngũ Quả" onerror="this.src='https://via.placeholder.com/500x600.png?text=Loi+anh+mamnguqua.jpg'">
        </div>
    </div>

    <!-- Hàng chữ Developer ở cuối trang -->
    <footer>
        <a href="https://www.facebook.com/toanvandepchai" target="_blank" class="developer-link">
            Developer: Nguyễn Văn Toàn
        </a>
    </footer>

    <!-- Cửa sổ nổi hiển thị câu hỏi -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="questionText">Câu hỏi sẽ hiện ở đây</h2>
            <input type="text" id="answerInput" placeholder="Nhập câu trả lời..." autocomplete="off">
            <br>
            <button onclick="checkAnswer()">TRẢ LỜI</button>
            <button class="close-btn" onclick="closeModal()">ĐÓNG</button>
        </div>
    </div>

    <!-- Thông báo sai -->
    <div id="toast">CÂU TRẢ LỜI SAI!</div>

    <!-- Âm thanh -->
    <audio id="audioDung" src="dung.mp3"></audio>
    <audio id="audioSai" src="sai.mp3"></audio>

    <script>
        const gameData = [
            { q: "1. A large green/yellow citrus fruit placed on the tray for good luck.", a: "pomelo", offset: 3 },
            { q: "2. A tropical fruit, its name sounds like 'enough' in the Southern dialect.", a: "papaya", offset: 4 },
            { q: "3. A sweet yellow fruit, its name sounds like 'to spend' in the Southern dialect.", a: "mango", offset: 5 },
            { q: "4. A curved fruit that often forms the base of the tray in Northern Vietnam.", a: "banana", offset: 3 },
            { q: "5. A small fruit symbolizing fullness and satisfaction (sung túc).", a: "fig", offset: 3 },
            { q: "6. A hard-shelled fruit with water inside, sounding like 'just enough'.", a: "coconut", offset: 0 },
            { q: "7. A tiny citrus fruit tree popular during Tet, symbolizing wealth.", a: "kumquat", offset: 2 },
            { q: "8. The tray consists of five different types of ____.", a: "fruit", offset: 3 },
            { q: "9. The place in the house where the tray is displayed to honor ancestors.", a: "altar", offset: 5 },
        ];

        let isSolved = new Array(gameData.length).fill(false);
        let currentRow = -1;
        const TARGET_COL = 5;

        document.getElementById("startBtn").addEventListener("click", function() {
            const elem = document.documentElement;
            try {
                if (elem.requestFullscreen) {
                    const promise = elem.requestFullscreen();
                    if (promise !== undefined) {
                        promise.catch(err => console.warn("Tính năng Fullscreen bị chặn bởi iframe/trình duyệt:", err));
                    }
                } else if (elem.webkitRequestFullscreen) { 
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { 
                    elem.msRequestFullscreen();
                }
            } catch (error) {
                console.warn("Không thể kích hoạt Fullscreen:", error);
            }
            document.getElementById("startScreen").style.display = "none";
        });

        function initBoard() {
            const board = document.getElementById("board");
            
            gameData.forEach((item, rowIndex) => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "row";
                rowDiv.id = `row-${rowIndex}`;
                rowDiv.dataset.row = rowIndex;
                rowDiv.onclick = () => openModal(rowIndex);

                for (let col = 0; col < 10; col++) {
                    const cell = document.createElement("div");
                    
                    if (col >= item.offset && col < item.offset + item.a.length) {
                        cell.className = "cell";
                        if (col === TARGET_COL) {
                            cell.classList.add("highlight");
                            cell.dataset.highlight = "true";
                        }
                        cell.dataset.charIndex = col - item.offset; 
                    } else {
                        cell.style.visibility = "hidden";
                    }
                    rowDiv.appendChild(cell);
                }
                board.appendChild(rowDiv);
            });
        }

        function openModal(rowIndex) {
            if (isSolved[rowIndex]) return; 

            currentRow = rowIndex;
            document.getElementById("questionText").innerText = gameData[rowIndex].q;
            const input = document.getElementById("answerInput");
            input.value = "";
            document.getElementById("modalOverlay").style.display = "flex";
            input.focus();
        }

        function closeModal() {
            document.getElementById("modalOverlay").style.display = "none";
        }

        document.getElementById("answerInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkAnswer();
        });

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 2500);
        }

        function checkAnswer() {
            const userInput = document.getElementById("answerInput").value.trim().toLowerCase();
            const correctAnswer = gameData[currentRow].a.toLowerCase();
            const rowElement = document.getElementById(`row-${currentRow}`);
            const cells = rowElement.querySelectorAll('.cell');
            
            closeModal();

            if (userInput === correctAnswer) {
                // Play sound if you have dung.mp3
                try { document.getElementById("audioDung").play(); } catch(e){}
                
                isSolved[currentRow] = true;
                rowElement.classList.add("solved");

                cells.forEach((cell, index) => {
                    setTimeout(() => {
                        cell.innerText = correctAnswer[index];
                        cell.classList.remove("wrong");
                        cell.classList.add("correct");
                    }, index * 200);
                });

                if (isSolved.every(status => status === true)) {
                    const timeToWait = correctAnswer.length * 200 + 500;
                    setTimeout(triggerWin, timeToWait);
                }

            } else {
                // Play sound if you have sai.mp3
                try { document.getElementById("audioSai").play(); } catch(e){}
                showToast("CÂU TRẢ LỜI SAI!");
                
                const paddedInput = userInput.padEnd(correctAnswer.length, ' ').substring(0, correctAnswer.length);

                cells.forEach((cell, index) => {
                    setTimeout(() => {
                        cell.innerText = paddedInput[index] !== ' ' ? paddedInput[index] : '?';
                        cell.classList.remove("correct");
                        cell.classList.add("wrong");
                    }, index * 200);
                });

                const fadeDelay = correctAnswer.length * 200 + 1000;
                
                setTimeout(() => {
                    cells.forEach((cell, index) => {
                        setTimeout(() => {
                            cell.classList.remove("wrong");
                            cell.innerText = "";
                        }, index * 150);
                    });
                }, fadeDelay);
            }
        }

        function triggerWin() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 8,
                    angle: 60,
                    spread: 60,
                    origin: { x: 0 },
                    colors: ['#f1c40f', '#a71d2a', '#2ecc71']
                });
                confetti({
                    particleCount: 8,
                    angle: 120,
                    spread: 60,
                    origin: { x: 1 },
                    colors: ['#f1c40f', '#a71d2a', '#2ecc71']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());

            const highlightCells = document.querySelectorAll('.cell[data-highlight="true"]');
            highlightCells.forEach((cell, i) => {
                setTimeout(() => {
                    cell.classList.add("win-glow");
                }, i * 150); 
            });
        }

        window.onload = initBoard;
    </script>
</body>
</html>
